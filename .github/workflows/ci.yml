name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make CC=gcc
      - run: make test CC=gcc
      - name: Fuzz and prove fixed-seed determinism
        run: |
          make fuzz CC=gcc FUZZ_ITERS=200000 FUZZ_SEED=1 > fuzz-1.txt
          cat fuzz-1.txt
          make fuzz CC=gcc FUZZ_ITERS=200000 FUZZ_SEED=1 > fuzz-2.txt
          cat fuzz-2.txt
          grep '^fuzz_' fuzz-1.txt > fuzz-results-1.txt
          grep '^fuzz_' fuzz-2.txt > fuzz-results-2.txt
          diff -u fuzz-results-1.txt fuzz-results-2.txt
      - run: make perf CC=gcc

  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make CC=clang
      - run: make test CC=clang

  pty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: First-paint PTY suite with GCC
        run: make test-pty CC=gcc
      - name: First-paint PTY suite with Clang
        run: |
          make clean
          make test-pty CC=clang
      - name: Prove inherited colour settings cannot affect goldens
        run: COLORTERM=truecolor make test-pty CC=clang

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make test CC=clang SAN=1 BUILD=build-san
      - name: Fuzz, including the 60-second input campaign
        run: make fuzz CC=clang SAN=1 BUILD=build-san FUZZ_ITERS=200000 FUZZ_SEED=1 FUZZ_SECONDS=60

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - run: make test VALGRIND=1

  torture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prove the no-corruption save contract
        run: make torture CC=gcc

  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: SMOKE_MODULES=none make test 'MODULES='

  unicode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate Unicode tables offline
        run: |
          (cd ucd && sha256sum -c MANIFEST)
          make unicode-tables
          git diff --exit-code src/unicode/tables.c
          sha256sum src/unicode/tables.c > unicode.sha256
          make unicode-tables
          sha256sum -c unicode.sha256

  fuzz-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run date-seeded 2M Unicode campaign
        run: |
          seed=$(date -u +%Y%m%d)
          echo "nightly fuzz seed=$seed"
          make fuzz CC=gcc FUZZ_ITERS=2000000 FUZZ_SEED="$seed"

  torture-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run the extended external-SIGKILL campaign
        run: make torture CC=gcc TORTURE_SIGKILL_ITERS=5000

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare test output
        run: |
          make test > /dev/null 2>&1
          make test > r1.txt 2>&1
          make test > r2.txt 2>&1
          diff r1.txt r2.txt
      - name: Compare PTY runner output
        run: |
          make test-pty > pty-1.txt 2>&1
          make test-pty > pty-2.txt 2>&1
          diff -u pty-1.txt pty-2.txt
      - name: Compare clean rebuilds
        run: |
          make clean
          make
          sha256sum build/sagitta > s1
          make clean
          make
          sha256sum -c s1

  bans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: scripts/bans.sh
