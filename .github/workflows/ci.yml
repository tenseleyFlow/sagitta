name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  # A push event that is dropped -- or refused because Actions billing is
  # blocked, which looks identical: every job fails in seconds with no
  # log -- leaves no run to re-run, so one can be launched by hand
  # against the commit that lost it.
  workflow_dispatch:
    inputs:
      nightly:
        description: Also run the nightly-only campaigns
        type: boolean
        default: false
      # Valgrind on demand WITHOUT the rest of the nightly set, because
      # "run it when you touched src/text" has to be one command or it
      # will not happen.  A dispatch also lands in its own concurrency
      # group (see below), so a later push cannot cancel the very lane
      # you asked for.
      valgrind:
        description: Also run the valgrind lane on this push
        type: boolean
        default: false

#
# One run per ref, newest wins.
#
# Not a cost measure -- this repo is public, so standard runners are
# free.  A full run is 11 jobs and the fuzz lanes take the better part of
# an hour, so pushing three times in a row left three complete runs
# racing, two of them testing commits nobody would ship and all three
# reporting into the same branch.  Cancelling the superseded run costs no
# coverage: the newest commit is still tested in full.
#
#
# The EVENT is part of the key, not just the ref.
#
# With `ci-<ref>` alone, the nightly cron and ordinary pushes shared one
# group on trunk and cancelled each other: on 2026-08-09 the 04:17
# schedule killed an in-flight push run, and the next push killed the
# schedule. Both losses are silent -- a cancelled run reports no
# failure, so the deep campaigns simply never ran and nobody was told.
#
# Keyed by event, a push still supersedes an older push (which is the
# whole point) while the nightly runs to completion alongside.
#
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gcc:
    runs-on: ubuntu-latest
    # SMOKE DEPTH, and the reason is measured, not guessed.
    #
    # At full depth this step took 1 h 17 m here and 1 h 47 m in the
    # sanitize lane -- about three runner-hours per push, on two lanes
    # that gate every push, for campaigns whose job is EXPLORATION.
    # Exploration does not belong on the critical path: what a gating
    # lane needs is that every campaign still runs, so a change that
    # introduces a crash or a sanitizer finding is caught, and that is
    # what a tenth of the iterations buys.
    #
    # The depth did not disappear -- fuzz-deep-nightly runs exactly
    # these campaigns at the old budget under both compilers. Dropping
    # the iterations WITHOUT that job would have been a silent coverage
    # cut dressed up as a speedup.
    env:
      FUZZ_ITERS: 20000
      CMDPARSE_FUZZ_ITERS: 50000
      MULTICURSOR_FUZZ_OPS: 10000
      MULTICURSOR_FUZZ_SEEDS: 1
      MOUSE_FUZZ_EVENTS: 25000
      MOUSE_FUZZ_SEEDS: 1
      GROUPS_FUZZ_SESSIONS: 25
      GROUPS_FUZZ_SEEDS: 1
      TEXTBUF_FUZZ_SEEDS: 1
      UNITS_FUZZ_SEEDS: 1
    steps:
      - uses: actions/checkout@v6
      - run: make CC=gcc
      - run: make test CC=gcc
      - name: Run the fixed campaigns at smoke depth
        run: make fuzz CC=gcc FUZZ_SEED=1

  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make CC=clang
      - run: make test CC=clang
      - name: Compile the campaign, fixture, and budget binaries
        run: |
          make CC=clang BUILD=build-clang \
            build-clang/fuzz_textbuf build-clang/gen-bigfile \
            build-clang/perf_textbuf build-clang/perf_latency \
            build-clang/fuzz_cmdparse build-clang/perf_cmdcomp

  # Sprint 57: pin the native musl environment instead of relying on the
  # distro and version installed on a moving hosted image.  Run Alpine in a
  # container from the Ubuntu host so checkout's Node runtime remains glibc-
  # compatible while every yew compile, link, and test uses Alpine's musl.
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build, test, and reproduce the Alpine 3.20 static PIE
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            alpine:3.20 sh -ec '
              apk add --no-cache bash build-base curl file git
              echo "Alpine $(cat /etc/alpine-release)"
              apk info -v bash curl git gcc musl-dev binutils
              gcc --version | sed -n "1p"
              ldd --version 2>&1 | sed -n "1p"
              ld --version | sed -n "1p"

              cp -a /src /work
              chown -R nobody:nobody /work
              su nobody -s /bin/sh -c '\''
              cd /work

              make -j2 TARGET=x86_64-linux-musl CROSS= MUSL_CC=gcc \
                BUILD=build-musl musl-verify
              make -j2 TARGET=x86_64-linux-musl CROSS= MUSL_CC=gcc \
                BUILD=build-musl test
              '\''

              cd /work
              make TARGET=x86_64-linux-musl CROSS= MUSL_CC=gcc \
                BUILD=build-musl test-musl-hosts

              su nobody -s /bin/sh -c '\''
              cd /work
              sha256sum build-musl/yew > /tmp/yew.first
              make TARGET=x86_64-linux-musl CROSS= MUSL_CC=gcc \
                BUILD=build-musl clean
              make -j2 TARGET=x86_64-linux-musl CROSS= MUSL_CC=gcc \
                BUILD=build-musl musl-verify
              sha256sum build-musl/yew > /tmp/yew.second
              cmp /tmp/yew.first /tmp/yew.second
              '\''
            '

  alloc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build allocation accounting and run its unit contract
        run: make CC=gcc BUILD=build-adbg ALLOCDBG=1 test-alloc-debug
      - name: Gate steady-state editor allocations
        run: make CC=gcc BUILD=build-adbg ALLOCDBG=1 perf-alloc

  # The public hosted arm64 image is functional/advisory evidence, not the
  # pinned perf-arm64-linux baseline authority.  It keeps the ISA-specific
  # build and the complete quick performance harness live while the separate
  # designated job below remains fail-closed behind its registered runner.
  arm64-hosted:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Build and test arm64 with GCC
        run: |
          make CC=gcc
          make test CC=gcc
      - name: Run Sprint 56 arm64 metrics in advisory mode
        run: |
          make perf CC=gcc PERF_GATE=0 PERF_RUNNER_ID=hosted-arm64

  # Sprint 30 DoD 1 and 5.  The computed-goto dispatcher is a SECOND
  # implementation of the interpreter, so it needs its own lane: a
  # divergence between the two shows up as a program computing a
  # different answer, and nothing in the default build would notice.
  fletch-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Full suite with computed-goto dispatch, GCC
        run: make FL_CGOTO=1 test CC=gcc
      - name: Full suite with computed-goto dispatch, Clang
        run: |
          make clean
          make FL_CGOTO=1 test CC=clang
      - name: Byte-compare the executed-opcode traces of both dispatchers
        run: |
          make clean
          make fl-dispatch-parity
      # s33 DoD 11: the CONFORMANCE SUITE under both dispatchers, which
      # is a different claim from the opcode-trace parity above -- that
      # one compares instruction streams, this one compares what the
      # programs actually printed.
      - name: Run the conformance suite under both dispatchers
        run: |
          make clean
          make test-fletch-dispatch
      - name: Perf smoke, numbers only (s33 owns the gates)
        run: make fl-perf-smoke

  # Sprint 33: the conformance suite's own lanes.  Separate from `gcc`
  # because a stress run and a determinism run answer different
  # questions from a plain green suite, and folding them in would hide
  # which one failed.
  fletch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Conformance suite, coverage gate, meta-suite, gate selftest
        run: make test-fletch
      - name: The whole suite under the collector's stress mode
        run: make test-fletch-gc-stress
      - name: Two runs and two ledgers, byte-compared
        run: make test-fletch-determinism
      # UNGATED here: the absolute budgets have 3x-40x headroom on the
      # dev machine and clear a slower runner, but the two-condition
      # regression gate compares against dev-machine baselines and
      # would fail on hardware rather than on a regression.  The perf
      # lane runs it with PERF_GATE=1; Sprint 56 recalibrates.
      - name: Benches, absolute budgets enforced
        run: make bench-fletch
      - name: Round-trip law
        run: make test-fletch-roundtrip

  # Sprint 37: editor-backed Fletch tests are a product lane, not part of
  # the language-only conformance runner above.  Keep the explicit job even
  # though `make test` also depends on it, so protocol or determinism failures
  # name the surface that regressed.
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Script runner and editor corpus, GCC
        run: make test-script CC=gcc
      - name: Byte-identical repeated runs
        run: make test-script-determinism CC=gcc
      - name: Enforce the whole-suite budget
        run: make test-script-budget CC=gcc
      - name: Script runner and editor corpus, Clang
        run: |
          make clean
          make test-script CC=clang

  pty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: First-paint PTY suite with GCC
        run: make test-pty CC=gcc
      - name: First-paint PTY suite with Clang
        run: |
          make clean
          make test-pty CC=clang
      - name: Prove inherited colour settings cannot affect goldens
        run: COLORTERM=truecolor make test-pty CC=clang

  # Sprint 47 milestone: the editor's production LSP client must drive a
  # real clangd over yew's own source tree.  Missing clangd is a failure in
  # this lane so the integration proof cannot silently rot into a skip.
  lsp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install the designated clangd
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clangd
      - name: Assert the designated runner provides clangd
        run: clangd --version
      - name: Navigate, rename, diagnose, and hover through live clangd
        run: YEW_LSP_CI_REQUIRED=1 make test-lsp-live CC=clang

  sanitize:
    runs-on: ubuntu-latest
    # Smoke depth, for the reason spelled out on the gcc lane above.
    # The sanitized run is the slower of the two (ASan multiplies every
    # campaign), so it is the one that gains most from the cut -- and
    # `make test CC=clang SAN=1`, which is what actually validates a
    # change under ASan and UBSan, is untouched at full strength.
    env:
      FUZZ_ITERS: 20000
      CMDPARSE_FUZZ_ITERS: 50000
      MULTICURSOR_FUZZ_OPS: 10000
      MULTICURSOR_FUZZ_SEEDS: 1
      MOUSE_FUZZ_EVENTS: 25000
      MOUSE_FUZZ_SEEDS: 1
      GROUPS_FUZZ_SESSIONS: 25
      GROUPS_FUZZ_SEEDS: 1
      TEXTBUF_FUZZ_SEEDS: 1
      UNITS_FUZZ_SEEDS: 1
    steps:
      - uses: actions/checkout@v6
      # FL_CHECKS turns on fl_chunk_check after every compile and the
      # VM's per-instruction invariant checks.  Off in the gating
      # lanes because the second group is on the hot path; on here,
      # which is where a compiler bug should surface.
      - run: make test CC=clang SAN=1 FL_CHECKS=1 BUILD=build-san
      - name: Run all fixed campaigns under ASan and UBSan, smoke depth
        run: make fuzz CC=clang SAN=1 FL_CHECKS=1 BUILD=build-san FUZZ_SEED=1

  valgrind:
    #
    # NOT ON EVERY PUSH -- it was 49 of the run's 50 minutes.
    #
    # Ten of the other twelve lanes report inside 9 minutes and the
    # slowest, sanitize, inside 23; valgrind alone doubled that, and
    # because the concurrency group cancels in-flight runs, pushing
    # again threw away the one expensive thing in the run.  The result
    # was ~50 minutes of serialised waiting per commit.
    #
    # WHAT THIS COSTS, stated plainly: a valgrind-only regression can now
    # sit undetected for up to a day.  That is a real reduction in
    # coverage per commit, accepted because this lane has caught roughly
    # one bug per campaign rather than one per commit -- the s17 crash
    # journal fd left open at exit being the last.
    #
    # SO RUN IT DELIBERATELY when the change could plausibly leak, alias
    # or outlive an object:
    #
    #     gh workflow run CI --ref trunk -f valgrind=true
    #
    # and always before landing anything that touches src/text/,
    # src/edit/, src/term/, the handle table, or a teardown path.  ASan
    # covers much of this per-push, but not fd tracking, not uninitialised
    # reads, and not the stretched-timing pty behaviour that QUIET_SCALE
    # exposes.
    if: github.event_name == 'schedule' || inputs.nightly || inputs.valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Run properties at the leak-check cadence
        run: YEW_PROP_N=50 make test VALGRIND=1

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify deterministic 100 MiB fixtures
        run: make fixtures-verify-quick CC=gcc
      - name: Run the budget suite five times without flapping
        run: |
          for run in 1 2 3 4 5; do
            echo "performance stability run=$run"
            make perf-textbuf CC=gcc PERF_ADVISORY=0 \
              PERF_RUNNER_ID=perf-x86_64-linux-gnu
          done
      - name: Prove the absolute gate rejects an injected delay
        run: make perf-gate-selftest CC=gcc
      - name: Run subsystem budgets despite runner noise
        run: |
          for target in perf-unicode perf-render perf-shadow perf-cursor \
            perf-undo perf-units perf-multicursor perf-piece; do
            passed=0
            for attempt in 1 2 3; do
              if make "$target" CC=gcc; then
                passed=1
                break
              fi
              echo "$target budget retry attempt=$attempt"
            done
            if [ "$passed" -ne 1 ]; then
              exit 1
            fi
          done
      - name: Enforce Sprint 14 editor latency budgets
        run: |
          make perf-latency CC=gcc
          make perf-latency-selftest CC=gcc
      # THE ABSOLUTE BUDGETS, NOT THE REGRESSION GATE.
      #
      # `PERF_GATE=1` compares against tests/perf/baselines/fletch_dev.txt,
      # which was measured on a developer machine; ubuntu-latest is a
      # shared runner and came in 19% over on strbuild_concat while
      # clearing every absolute budget by 3x to 45x.  That is hardware,
      # not a regression, and a gate that fails on hardware gets turned
      # off.  The budgets ARE the contract (02-fletch.md req 7,
      # 00-decisions.md), and they are enforced here.
      #
      # The two-condition gate needs a baseline for the runner it runs
      # on, the way perf-textbuf uses PERF_RUNNER_ID.  Sprint 56
      # calibrates the reference hardware and can add
      # `BASELINE=<runner>` here in the same commit.
      - name: Enforce the Sprint 33 Fletch absolute budgets
        run: make bench-fletch CC=gcc
      - name: Enforce Sprint 18 completion latency budget
        run: make perf-cmdcomp CC=gcc
      - name: Enforce Sprint 35 recorder latency budgets
        run: make perf-record CC=gcc PERF_GATE=1
      - name: Enforce Sprint 37 batch startup budget
        run: |
          make perf-batch CC=gcc
          make perf-batch-selftest CC=gcc
      - name: Enforce Sprint 53 Git gutter latency budgets
        run: |
          passed=0
          for attempt in 1 2 3; do
            if make perf-git-gutter CC=gcc; then
              passed=1
              break
            fi
            echo "perf-git-gutter budget retry attempt=$attempt"
          done
          if [ "$passed" -ne 1 ]; then
            exit 1
          fi
      - name: Enforce AI transport, streaming, and privacy budgets
        run: |
          make perf-ai-http perf-ai-privacy CC=gcc
          passed=0
          for attempt in 1 2 3; do
            if YEW_PERF_ADVISORY=1 make perf-ai-shadow CC=gcc; then
              passed=1
              break
            fi
            echo "perf-ai-shadow budget retry attempt=$attempt"
          done
          if [ "$passed" -ne 1 ]; then
            exit 1
          fi
      - name: Enforce Sprint 54 plugin startup budgets
        run: make perf-plug CC=gcc
      - name: Enforce Sprint 55 package and cloud budgets
        run: make perf-pkg perf-cloud CC=gcc
      - name: Run Sprint 56 end-to-end harnesses in advisory mode
        run: |
          make perf-s56-functional CC=gcc PERF_ADVISORY=1 PERF_GATE=0 \
            YEW_PERF_SMOKE=1

  perf-designated-x86_64:
    if: vars.YEW_PERF_X86_64_ENABLED == '1'
    runs-on: [self-hosted, linux, x64, yew-perf-x86_64]
    steps:
      - uses: actions/checkout@v6
      - name: Verify fixtures and run calibrated gates
        run: |
          make fixtures-verify-quick CC=gcc
          make perf CC=gcc PERF_GATE=1 \
            PERF_RUNNER_ID=perf-x86_64-linux-gnu \
            CALIB_REFERENCE=tests/perf/calib-reference.txt

  perf-designated-arm64:
    if: vars.YEW_PERF_ARM64_ENABLED == '1'
    runs-on: [self-hosted, linux, arm64, yew-perf-arm64]
    steps:
      - uses: actions/checkout@v6
      - name: Verify fixtures and run calibrated gates
        run: |
          make fixtures-verify-quick CC=gcc
          make perf CC=gcc PERF_GATE=1 \
            PERF_RUNNER_ID=perf-arm64-linux \
            CALIB_REFERENCE=tests/perf/calib-reference-arm64.txt

  torture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prove the no-corruption save contract
        run: make torture CC=gcc

  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: SMOKE_MODULES=none make test 'MODULES='
      - name: Prove package independence from FUSS and optional modules
        run: make clean && make check MODULES=plugins

  unicode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate Unicode tables offline
        run: |
          (cd ucd && sha256sum -c MANIFEST)
          make unicode-tables
          git diff --exit-code src/unicode/tables.c src/unicode/tables_wb.c
          sha256sum src/unicode/tables.c src/unicode/tables_wb.c > unicode.sha256
          make unicode-tables
          sha256sum -c unicode.sha256

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build GCC and Clang deterministic tools
        run: |
          make CC=gcc BUILD=build-det-gcc \
            build-det-gcc/fuzz_textbuf build-det-gcc/fuzz_cmdparse \
            build-det-gcc/gen-bigfile
          make CC=clang BUILD=build-det-clang \
            build-det-clang/fuzz_textbuf build-det-clang/fuzz_cmdparse \
            build-det-clang/gen-bigfile
      - name: Compare edit traces across runs and compilers
        run: |
          build-det-gcc/fuzz_textbuf --iters=5000 --seed=0x9e3779b97f4a7c15 \
            --mix=typing --trace-out=trace-gcc-1.txt
          build-det-gcc/fuzz_textbuf --iters=5000 --seed=0x9e3779b97f4a7c15 \
            --mix=typing --trace-out=trace-gcc-2.txt
          build-det-clang/fuzz_textbuf --iters=5000 --seed=0x9e3779b97f4a7c15 \
            --mix=typing --trace-out=trace-clang-1.txt
          diff -u trace-gcc-1.txt trace-gcc-2.txt
          diff -u trace-gcc-1.txt trace-clang-1.txt
          build-det-gcc/fuzz_textbuf --replay trace-gcc-1.txt > replay-gcc.txt
          build-det-clang/fuzz_textbuf --replay trace-gcc-1.txt > replay-clang.txt
          sed 's/replay=[^ ]*/replay=TRACE/' replay-gcc.txt > replay-gcc.norm
          sed 's/replay=[^ ]*/replay=TRACE/' replay-clang.txt > replay-clang.norm
          diff -u replay-gcc.norm replay-clang.norm
          build-det-gcc/fuzz_cmdparse --iters=10000 --seed=1 \
            > cmdparse-gcc.txt
          build-det-clang/fuzz_cmdparse --iters=10000 --seed=1 \
            > cmdparse-clang.txt
          diff -u cmdparse-gcc.txt cmdparse-clang.txt
      - name: Compare all fixture hashes across runs and compilers
        run: |
          while read -r profile bytes seed expected; do
            case "$profile" in ''|'#'*) continue ;; esac
            g1=$(build-det-gcc/gen-bigfile --hash --profile "$profile" \
              --size "$bytes" --seed "$seed")
            g2=$(build-det-gcc/gen-bigfile --hash --profile "$profile" \
              --size "$bytes" --seed "$seed")
            c1=$(build-det-clang/gen-bigfile --hash --profile "$profile" \
              --size "$bytes" --seed "$seed")
            c2=$(build-det-clang/gen-bigfile --hash --profile "$profile" \
              --size "$bytes" --seed "$seed")
            test "$g1" = "$expected"
            test "$g1" = "$g2"
            test "$g1" = "$c1"
            test "$g1" = "$c2"
            echo "$profile $g1"
          done < tests/perf/fixtures.sha
      - name: Compare test and PTY output
        run: |
          make test > /dev/null 2>&1
          make test > r1.txt 2>&1
          make test > r2.txt 2>&1
          diff -u r1.txt r2.txt
          make test-pty > pty-1.txt 2>&1
          make test-pty > pty-2.txt 2>&1
          diff -u pty-1.txt pty-2.txt
      - name: Compare clean rebuilds
        run: |
          make clean
          make
          sha256sum build/yew > s1
          make clean
          make
          sha256sum -c s1

  bans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: scripts/bans.sh
      - name: Reject mixed source and performance-baseline commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # The base must still EXIST.  `github.event.before` names the
          # commit the ref pointed at previously, which a force-push or
          # a history rewrite can leave dangling -- `git rev-list` then
          # dies with "Invalid revision range" and fails the lane for a
          # reason that has nothing to do with the code.  Falling back
          # to the head commit checks strictly less, so it cannot hide a
          # violation in the commits it skips; it just stops a rewrite
          # from reading as a source failure.
          if test -n "$BASE_SHA" \
             && ! printf '%s' "$BASE_SHA" | grep -Eq '^0+$' \
             && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            commits=$(git rev-list "$BASE_SHA..$HEAD_SHA")
          else
            commits=$HEAD_SHA
          fi
          for commit in $commits; do
            scripts/perf-baseline-guard.sh --commit "$commit"
          done

  # The depth the gcc and sanitize lanes used to carry on every push.
  #
  # Same campaigns, same budget (the Makefile defaults ARE that budget,
  # so this job passes no overrides and cannot drift from them). Both
  # compilers, because they find different things: ASan and UBSan catch
  # what gcc's codegen hides, and gcc's codegen reaches what clang's
  # does not.
  #
  # MEASURED on the run that motivated the split: ~1 h 47 m sanitized
  # and ~1 h 17 m plain, so roughly 3 h 20 m for the pair against
  # GitHub's 6 h ceiling. If that margin ever gets thin, split the two
  # steps into two jobs -- they are independent and would then run in
  # parallel with their own budgets.
  fuzz-deep-nightly:
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fixed campaigns at full depth under ASan and UBSan
        run: |
          make fuzz CC=clang SAN=1 BUILD=build-deep-san \
            FUZZ_SEED=1 FUZZ_SECONDS=60
      - name: Run the recorder emitter for ten minutes under ASan and UBSan
        run: build-deep-san/fuzz_record --seconds=600 --seed=1
      # No `make clean` between the two: they use different BUILD dirs,
      # so their objects never meet. Mixing sanitized and plain objects
      # in one tree is the trap that produces a binary whose behaviour
      # depends on what happened to be stale.
      - name: Fixed campaigns at full depth under GCC
        run: make fuzz CC=gcc FUZZ_SEED=1
      - name: Attach any minimized findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deep-campaign-traces
          path: tests/fuzz/crashes/*.trace
          if-no-files-found: ignore

  fuzz-nightly:
    # Nightly by cron, and on demand without waiting for one:
    #   gh workflow run CI --ref trunk -f nightly=true
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fuzz plugin manifest data for one hour under ASan and UBSan
        run: |
          make fuzz-plug-manifest CC=clang SAN=1 BUILD=build-plug-san \
            PLUG_FUZZ_SECONDS=3600 FUZZ_SEED=1
      - name: Fuzz package trees for one hour under ASan and UBSan
        run: |
          make fuzz-pkg-tree-long CC=clang SAN=1 BUILD=build-pkg-san \
            PLUG_FUZZ_SECONDS=3600 FUZZ_SEED=1
      - name: Run randomized text campaigns for 30 minutes
        run: make fuzz-long CC=clang SAN=1 BUILD=build-nightly-san
      - name: Run the Sprint 35 round-trip law at nightly depth
        run: |
          seed=$(date -u +%Y%m%d)
          YEW_RT_SEEDS=100000 YEW_RT_BASE_SEED="$seed" \
            make test-roundtrip CC=gcc BUILD=build-nightly
      - name: Attach minimized open findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: textbuf-crash-traces
          path: |
            tests/fuzz/crashes/*.trace
            build-nightly/tmp/fail-*.rec
          if-no-files-found: ignore
      - name: Run P6 and P8 at nightly depth
        run: |
          make CC=clang SAN=1 BUILD=build-nightly-san \
            build-nightly-san/unit_tests
          YEW_PROP_N=20000 build-nightly-san/unit_tests \
            --filter textbuf_prop_p6_undo_redo_identity
          YEW_PROP_N=20000 build-nightly-san/unit_tests \
            --filter textbuf_prop_p8_branch_preservation
      - name: Run the date-seeded 2M legacy campaigns
        run: |
          make CC=gcc BUILD=build-nightly \
            build-nightly/fuzz_utf8 build-nightly/fuzz_grapheme \
            build-nightly/fuzz_input build-nightly/fuzz_grid \
            build-nightly/fuzz_vt build-nightly/fuzz_undo
          seed=$(date -u +%Y%m%d)
          for target in utf8 grapheme input grid vt undo; do
            build-nightly/fuzz_$target --iters=2000000 --seed="$seed"
          done

  perf-nightly:
    # Nightly by cron, and on demand without waiting for one:
    #   gh workflow run CI --ref trunk -f nightly=true
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify every full-size fixture and run 1 GiB budgets
        run: |
          make fixtures-verify CC=gcc
          make perf-huge CC=gcc PERF_ADVISORY=1

  torture-nightly:
    # Nightly by cron, and on demand without waiting for one:
    #   gh workflow run CI --ref trunk -f nightly=true
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run the extended external-SIGKILL campaign
        run: make torture CC=gcc TORTURE_SIGKILL_ITERS=5000
